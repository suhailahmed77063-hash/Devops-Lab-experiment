<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Registration</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: #f4f6fb;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      padding: 32px 36px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(16, 24, 40, .08);
      width: 360px;
    }
    h1 { font-size: 22px; margin: 0 0 4px; color: #101828; }
    p.sub { margin: 0 0 20px; color: #667085; font-size: 14px; }
    label { display: block; font-size: 13px; color: #344054; margin: 14px 0 6px; }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 14px;
    }
    input:focus { outline: 2px solid #7f56d9; border-color: transparent; }
    input[type="submit"] {
      margin-top: 22px;
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 8px;
      background: #7f56d9;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    input[type="submit"]:hover { background: #6941c6; }
    .error {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fef3f2;
      color: #b42318;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Event Registration</h1>
    <p class="sub">Fill in your details to register for the event.</p>

    <form method="post" action="/register">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Name" value="{{ name or '' }}">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Email" value="{{ email or '' }}">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Password">

      <input type="submit" value="Submit">
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
  </div>
</body>
</html>
