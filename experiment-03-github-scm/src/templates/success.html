<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration Successful</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: #f4f6fb;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      padding: 36px 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(16, 24, 40, .08);
      text-align: center;
      max-width: 380px;
    }
    .badge {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #ecfdf3;
      color: #039855;
      font-size: 28px;
      line-height: 56px;
    }
    h2 { margin: 0 0 8px; color: #101828; font-size: 22px; }
    p { margin: 0 0 22px; color: #667085; font-size: 14px; }
    a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      background: #7f56d9;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">&#10003;</div>
    <h2>Registration Successful</h2>
    <p>
      {% if name %}Thanks, {{ name }}. {% endif %}
      Your details have been recorded for the event.
    </p>
    <a href="/register">Register another participant</a>
  </div>
</body>
</html>
